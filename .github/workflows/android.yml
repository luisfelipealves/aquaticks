name: Wear OS APK
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Reuse debug signing key for test upgrades
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aquaticks-debug-key-v1
      - name: Test, lint and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aquaticks-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquaticks-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
